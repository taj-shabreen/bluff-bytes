<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Bluff Bytes: a party game for clever liars" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1410"/><stop offset="1" stop-color="#080c0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#a6f3a0" stop-opacity="0.16"/><stop offset="1" stop-color="#a6f3a0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#26382b" stroke-width="1" opacity="0.55"/>
    </pattern>
    <clipPath id="frame"><rect x="8" y="8" width="1184" height="304" rx="18"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'DM Mono','Cascadia Code',Consolas,'Courier New',monospace}
    .title{font-size:96px;font-weight:700;letter-spacing:6px}
    .tag{font-size:20px;letter-spacing:4px}
    .scan{animation:scan 5s linear infinite}
    @keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(340px)}}
    .blink{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .spin{transform-origin:1040px 150px;animation:spin 12s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .l1,.l2,.l3{opacity:0}
    .l1{animation:cyc 9s infinite}
    .l2{animation:cyc 9s infinite 3s}
    .l3{animation:cyc 9s infinite 6s}
    @keyframes cyc{0%{opacity:0}6%{opacity:1}30%{opacity:1}36%{opacity:0}100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){.scan,.blink,.spin,.l1,.l2,.l3{animation:none}.l1{opacity:1}}
  </style>
  <rect x="8" y="8" width="1184" height="304" rx="18" fill="url(#bg)" stroke="#42654a" stroke-width="2"/>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect class="scan" x="0" y="0" width="1200" height="34" fill="#a6f3a0" opacity="0.05"/>
  </g>
  <text class="mono" x="60" y="62" font-size="15" letter-spacing="3" fill="#ffbd62">&gt; THE DEFINITIONS GAME</text>
  <text class="mono title" x="56" y="165" fill="#e0f4dd">BLUFF</text>
  <text class="mono title" x="372" y="165" fill="none" stroke="#a6f3a0" stroke-width="2.2">BYTES</text>
  <rect class="blink" x="700" y="98" width="26" height="74" fill="#a6f3a0"/>
  <g class="spin" fill="none" stroke="#ffbd62" stroke-width="5" stroke-linecap="round">
    <path d="M1040 100V200M997 125L1083 175M997 175L1083 125"/>
  </g>
  <g class="mono tag" fill="#8ca091">
    <text class="l1" x="60" y="246">REAL CS &amp; AI TERMS. FAKE DEFINITIONS.</text>
    <text class="l2" x="60" y="246">ONE TRUE ANSWER HIDING IN THE LINEUP.</text>
    <text class="l3" x="60" y="246">FOOL YOUR FRIENDS. FIND THE TRUTH. WIN.</text>
  </g>
  <g class="mono" font-size="14" letter-spacing="2" fill="#76b87a">
    <text x="60" y="286">05 ROUNDS</text><text x="200" y="286">·</text>
    <text x="226" y="286">2–8 PLAYERS</text><text x="392" y="286">·</text>
    <text x="418" y="286" fill="#ffbd62">+2 FIND THE TRUTH</text><text x="640" y="286">·</text>
    <text x="666" y="286" fill="#ffbd62">+1 FOOL A FRIEND</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
